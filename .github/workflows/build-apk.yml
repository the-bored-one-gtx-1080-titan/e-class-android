name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Dependencies
      run: npm install

    - name: Ensure www directory and index.html exist
      run: |
        mkdir -p www
        if [ ! -f "www/index.html" ]; then
          echo "<!DOCTYPE html><html><head><title>App</title></head><body><h1>Hello e-class</h1></body></html>" > www/index.html
        fi

    - name: Clean old Android folder if any
      run: rm -rf android

    - name: Add Android Platform
      run: npx cap add android

    - name: Sync Capacitor Android
      run: npx cap sync android

    - name: Build Debug APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: e-class-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
